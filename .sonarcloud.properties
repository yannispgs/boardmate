# SonarCloud Automatic Analysis reads this file (there is no scanner step and no
# sonar-project.properties — the GitHub App analyses every push itself).

# Our migrations are PostgreSQL, but Sonar only ships an ORACLE PL/SQL analyser
# and applies it to every .sql file. It reports the JSON we embed in seed data as
# "an illegal character with code point 10 was found in this literal", because
# Oracle forbids a newline inside a string literal and PostgreSQL does not. Every
# such issue is a dialect mismatch, never a defect: 12 of them already sit on
# main and each new seeding migration adds more. Migrations are reviewed by hand
# and exercised by the integration and e2e suites against a real database, so
# nothing is lost by keeping them out of the analysis.
sonar.exclusions=supabase/migrations/**
