# SonarCloud Automatic Analysis reads this file (there is no scanner step and no
# sonar-project.properties — the GitHub App analyses every push itself).
#
# Only the analysis SCOPE can be set here. Silencing a single rule would take a
# custom Quality Profile, and every profile is read-only on our plan (`copy`,
# `edit` and `associateProjects` are all false — same wall as the Quality Gate).
# So anything that cannot be excluded as a whole file is answered in the code
# with a `NOSONAR` and the reason it is there.

# Our migrations are PostgreSQL, but Sonar only ships an ORACLE PL/SQL analyser
# and applies it to every .sql file. It reports the JSON we embed in seed data as
# "an illegal character with code point 10 was found in this literal", because
# Oracle forbids a newline inside a string literal and PostgreSQL does not. Every
# such issue is a dialect mismatch, never a defect: 12 of them already sit on
# main and each new seeding migration adds more. Migrations are reviewed by hand
# and exercised by the integration and e2e suites against a real database, so
# nothing is lost by keeping them out of the analysis.
#
# Two more files are excluded, both because what Sonar reads there is not
# something we wrote by hand:
#   - database.types.ts is generated from the live schema by `supabase gen types`
#     and any edit to it is undone by the next generation. It reports two unions
#     where `never` is "overridden by other types" — Supabase's own output.
#   - globals.css is Tailwind v4, whose `@utility` and `@custom-variant` at-rules
#     the CSS analyser does not know. Every `&` nested inside one therefore reads
#     to it as a selector with no scoping root.
sonar.exclusions=supabase/migrations/**,src/lib/supabase/database.types.ts,src/app/globals.css
