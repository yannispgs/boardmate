# SonarQube Cloud (SonarCloud) analysis config. Keys assigned when the project
# is imported at sonarcloud.io — adjust if SonarCloud picked different ones.
sonar.projectKey=yannispgs_boardmate
sonar.organization=yannispgs

# Main code vs test code.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=src/**/*.test.ts

# Coverage: the lcov produced by `yarn test:coverage` (unit + integration).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated Supabase types aren't ours to analyse.
sonar.exclusions=src/lib/supabase/database.types.ts
# Don't demand coverage of tests, config, generated types, or the composition
# glue we deliberately leave to e2e (mirrors vitest.coverage.config.ts).
sonar.coverage.exclusions=**/*.test.ts,**/*.config.ts,tests/**,src/lib/supabase/database.types.ts
