name: E2E (full)

# The exhaustive end-to-end suite: every scenario, on Chromium AND WebKit
# (Safari/iOS engine). It is deliberately NOT a pull-request gate — it runs on
# push to main (i.e. after a PR merges) and on demand, so it never blocks a
# merge yet still sweeps for regressions on real code. Public repo → GitHub
# Actions minutes are free, so the extra coverage is essentially free.
#
# The fast @critical subset still runs per-PR (blocking) in ci.yml; this is the
# wide, slow, non-blocking net on top.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One full run per commit on main is plenty; supersede older queued runs.
concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: E2E full suite (Chromium + WebKit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.105.0
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Install Playwright browsers & system deps
        # Both engines: Chromium and WebKit. --with-deps pulls the OS libraries
        # and fonts each needs.
        run: yarn playwright install --with-deps chromium webkit
      - name: Start local Supabase (Docker)
        # Same local stack as the integration/critical suites; the mail catcher
        # receives the login OTP that the auth journey reads back.
        run: supabase start
      - name: Run full e2e suite
        # Every project (Chromium + WebKit), every scenario. Builds + starts the
        # app wired to the local stack, so no secrets are needed.
        run: yarn test:e2e:full
      - name: Upload Playwright report
        # Always kept: nobody watches a post-merge run live, so the report is the
        # record for triaging whatever the wide sweep turned up.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14
