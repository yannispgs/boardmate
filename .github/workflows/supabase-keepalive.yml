name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days without any API request.
# This pings each project's REST API daily with a real (RLS-filtered) query so
# neither the prod nor the dev project ever pauses. The anon keys are public
# (browser-shipped) but kept as secrets to keep them out of run logs.

on:
  schedule:
    # Daily at 06:37 UTC — frequent enough to survive a skipped/delayed run
    # well within the 7-day window; off the top-of-hour scheduler rush.
    - cron: "37 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prod
            url: https://eoateljqcdvwrqthwlma.supabase.co
            secret: SUPABASE_PROD_ANON_KEY
          - name: dev
            url: https://vwhhrolttzpymylokhqn.supabase.co
            secret: SUPABASE_DEV_ANON_KEY
    steps:
      - name: Query the REST API (counts as activity)
        env:
          ANON: ${{ secrets[matrix.secret] }}
        run: |
          set -euo pipefail
          # A select hits PostgREST -> Postgres, which resets the inactivity
          # timer. The query still reaches Postgres even when it is refused at
          # the table level (e.g. a 42501 grant denial surfaces as HTTP 401),
          # so any 2xx-4xx means the project processed the request = activity.
          # Only a 5xx or no response (000) means it is down/unreachable.
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            "${{ matrix.url }}/rest/v1/players?select=id&limit=1" \
            -H "apikey: ${ANON}" \
            -H "Authorization: Bearer ${ANON}")
          echo "${{ matrix.name }} REST ping -> HTTP ${code}"
          if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
            echo "project responded — inactivity timer reset"
          else
            echo "::error::no healthy response from ${{ matrix.name }} (HTTP ${code})"
            exit 1
          fi
