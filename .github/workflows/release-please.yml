name: release-please

# Runs on every push to main. Maintains a "release PR" that, when merged,
# bumps the version (SemVer, from Conventional Commits), updates CHANGELOG.md,
# tags the commit and publishes a GitHub Release.
on:
  push:
    branches: [main]

# Avoid overlapping runs racing on the release PR.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR & tagging
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
