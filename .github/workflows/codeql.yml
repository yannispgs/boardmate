name: CodeQL

# Static security analysis (GitHub Code Scanning). Advanced setup — a workflow
# we own — so we can pin every action to a digest and pick a broader query
# suite. Scans both our JS/TS and the GitHub Actions workflows themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan of main so advisories published against unchanged code
    # still surface (Mondays 04:27 UTC).
    - cron: "27 4 * * 1"

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Only what CodeQL needs: read the code, upload the results.
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves (unpinned actions, script
        # injection, …); `javascript-typescript` covers the app. Neither builds.
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialise CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Broader than the default "security" pack — more security queries at
          # the cost of a few more findings to triage. Swap for
          # "security-and-quality" to also get maintainability/quality checks.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
