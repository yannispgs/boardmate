name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Independent parallel jobs: each fails on its own so it's obvious what broke,
# and they run concurrently instead of one long sequential job.
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Linting & format check
        run: yarn lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Type checking
        run: yarn tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Run unit tests
        run: yarn test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Build the app
        run: yarn build
        # NEXT_PUBLIC_* are inlined at build time. These are non-secret
        # build-only placeholders so pages that instantiate the Supabase client
        # can be prerendered in CI (the build never connects). Real values come
        # from Vercel/Supabase at runtime, and from `supabase start` for tests.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key

  integration:
    name: Integration & RLS tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          # Pinned for reproducibility (CI matches what we validate locally);
          # bump deliberately like any other dependency.
          version: 2.105.0
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Start local Supabase (Docker)
        # Boots the full stack and applies supabase/migrations. Docker is
        # preinstalled on GitHub runners.
        run: supabase start
      - name: Run integration & RLS tests
        # The suite reads connection details from `supabase status` (see
        # tests/integration/env.ts), so no secrets are needed — local Supabase
        # ships fixed default keys.
        run: yarn test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.105.0
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Install Playwright browser & system deps
        # Chromium only; --with-deps pulls the OS libraries and fonts it needs.
        run: yarn playwright install --with-deps chromium
      - name: Start local Supabase (Docker)
        # Same local stack as the integration suite; the mail catcher receives
        # the login OTP that the auth journey reads back.
        run: supabase start
      - name: Run e2e tests
        # playwright.config.ts builds + starts the app wired to the local stack
        # (connection details from `supabase status`), so no secrets are needed.
        run: yarn test:e2e
      - name: Upload Playwright report
        # Kept on failure so a red journey is debuggable from the run page.
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.105.0
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Start local Supabase (Docker)
        run: supabase start
      - name: Run tests with coverage (unit + integration)
        # Both suites in one run so the report reflects everything they cover.
        run: yarn test:coverage
      - name: Upload coverage to Codecov
        # Codecov computes the project (total) + patch (changed-lines) coverage,
        # decorates the PR, and gates per codecov.yml. Token avoids the
        # tokenless shared-IP throttle (stored as a GitHub Actions secret).
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
