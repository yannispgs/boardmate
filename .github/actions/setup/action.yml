name: Setup
description: Shared Node 24 + Yarn 4 (Corepack) setup with an immutable install.

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        # Use the newest available Node 24 patch (matches what Vercel runs)
        # instead of the runner's bundled version.
        check-latest: true
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
