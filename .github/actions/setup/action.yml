name: Setup
description: Shared Node 24 + Yarn 4 (Corepack) setup with an immutable install.

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node 24
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        # Use the newest available Node 24 patch (matches what Vercel runs)
        # instead of the runner's bundled version.
        check-latest: true
        cache: yarn

    - name: Install dependencies
      shell: bash
      # Sonar asks here for lifecycle scripts to be turned off, on the grounds
      # that Yarn v2+ enables them by default. That stopped being true: Yarn
      # 4.16 ships `enableScripts: false` as its own default (`yarn config
      # enableScripts` reports source `<default>`), so nothing here runs a
      # package's install script already. Passing `--mode=skip-build` on top
      # would only restate the default and hide the day a dependency genuinely
      # needs building.
      run: yarn install --immutable # NOSONAR
